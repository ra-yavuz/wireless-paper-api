[platformio]
default_envs = paper

[env]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 80000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2

[env:paper]
build_flags =
  -D WIRELESS_PAPER
  -D PAPER_REVISION=11
lib_deps =
  ${env.lib_deps}
  https://github.com/todd-herbert/heltec-eink-modules.git#9207eb6ab2b96f66298e0488740218c17b006af7

[env:tracker]
build_flags =
  -D WIRELESS_TRACKER
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

[env:paper12]
extends = env:paper
build_flags =
  -D WIRELESS_PAPER
  -D PAPER_REVISION=12
