name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build public firmware without credentials
        run: |
          test ! -e include/secrets.h
          pio run
      - name: Native protocol and policy tests
        run: |
          mkdir -p .local
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude tests/protocol_test.cpp -o .local/protocol-test
          .local/protocol-test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude tests/policy_test.cpp -o .local/policy-test
          .local/policy-test
      - run: python -m unittest discover -s tests -v
